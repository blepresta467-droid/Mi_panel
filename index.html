<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel Semanal Interactivo</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #4a90e2;
            --primary-hover: #357abd;
            --text: #333333;
            --text-light: #666666;
            --border: #dddddd;
            --success: #2ecc71;
            --danger: #e74c3c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-top: 0;
            color: var(--primary);
        }
        /* Días de la semana */
        .days-container {
            display: flex;
            justify-content: space-between;
            gap: 5px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .day-btn {
            flex: 1;
            min-width: 45px;
            padding: 10px 5px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            text-align: center;
            transition: all 0.2s ease;
        }
        .day-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        /* Progreso */
        .progress-box {
            background: #eef2f7;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .progress-bar-bg {
            background: var(--border);
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }
        .progress-bar {
            background: var(--success);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        /* Input de Tareas */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .input-group input {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }
        .input-group button {
            padding: 12px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .input-group button:hover {
            background: var(--primary-hover);
        }
        /* Lista de Tareas */
        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid var(--border);
            animation: fadeIn 0.2s ease;
        }
        .task-item:last-child {
            border-bottom: none;
        }
        .task-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }
        .task-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .task-text {
            font-size: 1rem;
            word-break: break-word;
        }
        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-light);
        }
        .delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 5px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="panel-title">Mi Panel Semanal</h1>
    
    <!-- Selector de Días -->
    <div class="days-container">
        <button class="day-btn active" onclick="switchDay('Lunes')">Lun</button>
        <button class="day-btn" onclick="switchDay('Martes')">Mar</button>
        <button class="day-btn" onclick="switchDay('Miércoles')">Mié</button>
        <button class="day-btn" onclick="switchDay('Jueves')">Jue</button>
        <button class="day-btn" onclick="switchDay('Viernes')">Vie</button>
        <button class="day-btn" onclick="switchDay('Sábado')">Sáb</button>
        <button class="day-btn" onclick="switchDay('Domingo')">Dom</button>
    </div>

    <!-- Barra de Progreso -->
    <div class="progress-box">
        <div class="progress-text">
            <span>Progreso del día</span>
            <span id="progress-percentage">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <!-- Añadir Tarea -->
    <div class="input-group">
        <input type="text" id="task-input" placeholder="Nueva tarea para hoy..." onkeypress="handleKeyPress(event)">
        <button onclick="addTask()">+</button>
    </div>

    <!-- Lista de Tareas -->
    <ul class="task-list" id="task-list"></ul>
</div>

<script>
    let currentDay = 'Lunes';
    let data = JSON.parse(localStorage.getItem('weekly_productivity_data')) || {
        Lunes: [], Martes: [], Miércoles: [], Jueves: [], Viernes: [], Sábado: [], Domingo: []
    };

    function switchDay(day) {
        currentDay = day;
        document.querySelectorAll('.day-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText === day.substring(0,3) || (day==='Miércoles' && btn.innerText==='Mié') || (day==='Sábado' && btn.innerText==='Sáb'));
        });
        document.getElementById('panel-title').innerText = `Panel Semanal - ${day}`;
        document.getElementById('task-input').placeholder = `Nueva tarea para el ${day}...`;
        renderTasks();
    }

    function renderTasks() {
        const list = document.getElementById('task-list');
        list.innerHTML = '';
        const tasks = data[currentDay];

        tasks.forEach((task, index) => {
            const li = document.createElement('li');
            li.className = `task-item ${task.completed ? 'completed' : ''}`;
            li.innerHTML = `
                <div class="task-left">
                    <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
                    <span class="task-text">${task.text}</span>
                </div>
                <button class="delete-btn" onclick="deleteTask(${index})">×</button>
            `;
            list.appendChild(li);
        });

        updateProgress();
        saveData();
    }

    function addTask() {
        const input = document.getElementById('task-input');
        const text = input.value.trim();
        if (text === '') return;

        data[currentDay].push({ text: text, completed: false });
        input.value = '';
        renderTasks();
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') addTask();
    }

    function toggleTask(index) {
        data[currentDay][index].completed = !data[currentDay][index].completed;
        renderTasks();
    }

    function deleteTask(index) {
        data[currentDay].splice(index, 1);
        renderTasks();
    }

    function updateProgress() {
        const tasks = data[currentDay];
        const total = tasks.length;
        const completed = tasks.filter(t => t.completed).length;
        const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);

        document.getElementById('progress-bar').style.width = `${percentage}%`;
        document.getElementById('progress-percentage').innerText = `${percentage}%`;
    }

    function saveData() {
        localStorage.setItem('weekly_productivity_data', JSON.stringify(data));
    }

    // Inicializar día actual de la semana de forma inteligente
    const daysMap = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
    const today = daysMap[new Date().getDay()];
    switchDay(today);
</script>

</body>
</html>
